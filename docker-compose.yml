x-app-env: &app-env
  REDIS_URL: redis://redis:6379/0
  CHROMA_HOST: chromadb
  CHROMA_PORT: "8000"
  UPLOAD_DIR: /app/uploads
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:${CHROMA_IMAGE_TAG:-latest}
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes: ["chroma_data:/data"]

  api:
    build: .
    ports: ["8000:8000"]
    environment: *app-env
    volumes: ["./uploads:/app/uploads", "hf_cache:/root/.cache/huggingface"]
    depends_on:
      redis: {condition: service_healthy}
      chromadb: {condition: service_started}

  worker:
    build: .
    command: ["python3", "-m", "celery", "-A", "app.tasks:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment: *app-env
    volumes: ["./uploads:/app/uploads", "hf_cache:/root/.cache/huggingface"]
    depends_on:
      redis: {condition: service_healthy}
      chromadb: {condition: service_started}

volumes:
  redis_data:
  chroma_data:
  hf_cache: